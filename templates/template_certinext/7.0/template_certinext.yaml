# CertiNext DCV by Zabbix trapper — Zabbix 7.0 import file.
#
# Source of truth for the trapper items that `certinext-zabbix-push`
# (this repo) sends: the item keys here and the KEY_* constants in
# certinext_zabbix/zabbix_push.py must stay in sync
# (tests/test_template.py enforces it).
#
# ONE ZABBIX HOST PER CERTINEXT ENVIRONMENT. Item keys are bare
# (certinext.domains.total, not ...[prod]) because the Zabbix trapper does
# not expand user macros in item keys, so a key cannot be made unique per
# environment from a macro. Link this template to one logical host per
# environment (e.g. "CertiNext prod", "CertiNext sandbox"), set the host
# macro {$CERTINEXT.ENV} on each, and point each environment's pusher runs
# at its host with --zabbix-host / ZABBIX_HOSTNAME. A HIGH trigger fires if
# a run lands on the wrong host (certinext.env vs {$CERTINEXT.ENV}).
#
# Both hosts need a Zabbix agent interface on the machine running the
# pusher: the dns-persist TXT checks are passive agent items
# (net.dns.record), discovered from the apex list the pusher sends.
#
# Everything carries an env:{$CERTINEXT.ENV} tag. To mute sandbox
# notifications, add a condition to the relevant trigger action
# (Alerts → Actions):
#   Tag value | env | does not equal | sandbox
# Sandbox problems still show in the UI — they just never page anyone.
#
# Import via Data collection → Templates → Import. See this template's
# README.md for the manual steps around it (hosts, macros, scheduling the
# pusher).
zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: c97e1e605e9e4e1fa4050b09b1345599
    name: Templates/Custom
  templates:
  - uuid: af6fbfd6e8bf4e50a3ff7156f32b589b
    template: 'CertiNext DCV by Zabbix trapper'
    name: 'CertiNext DCV by Zabbix trapper'
    description: |
      CertiNext DCV health, pushed by the certinext-zabbix-push CLI from
      certinext-zabbix (https://github.com/tod-uma/certinext-zabbix).

      Link to one host per CertiNext environment and set {$CERTINEXT.ENV}
      on each (prod / sandbox); the pusher targets the host by name. Most
      items are trappers. The exception is the dns-persist discovery,
      whose item prototypes are passive Zabbix agent checks
      (net.dns.record) of each apex's _validation-persist TXT record — so
      each host needs an agent interface on the pusher machine.

      Three pusher schedules feed each host: a frequent run (domain
      totals), a daily run with --expiry-days (DCV expiry plus the
      dns-persist apex list) and an hourly run with --order-health (order
      health). With --validated-by CA the domain and DCV items measure only
      that CA's domain records; unset, every CA is counted together.
      nodata() triggers catch a dead pusher.

      DCV alerts follow each domain's DCV method. Token-method domains
      (DNS-TXT, HTTP, email...) have a real validTill deadline: they feed
      a severity gradient on min_days_left (WARNING 3d → AVERAGE 2d → HIGH
      1d → DISASTER lapsed, thresholds in the {$CERTINEXT.DCV.*_DAYS}
      macros), dependency-chained so only the most severe tier fires, and
      gated on token_domains > 0. DNS-PERSIST domains are re-checked by the
      CA at each issuance, so their validTill is only a reuse clock: it
      raises an INFORMATION event when it lapses, and the real dependency,
      the TXT record in public DNS, is checked by the agent against
      {$CERTINEXT.PERSIST.EXPECTED}.

      Order-health alerts on orders stuck awaiting issuance past
      {$CERTINEXT.ORDER.STUCK_AGE}, certificates generated but left
      undownloaded past {$CERTINEXT.ORDER.UNDOWNLOADED_AGE}, orders that
      recently failed, and no certificate issued for longer than
      {$CERTINEXT.ORDER.DAYS_SINCE_ISSUED_MAX} days.

      Both order-stuck triggers fire immediately against an account
      carrying abandoned orders from earlier experimentation — clear that
      backlog before enabling notifications. See docs/deployment.md.
    groups:
    - name: Templates/Custom
    items:
    - uuid: 925789812eeb4233bc222c056a62065c
      name: 'CertiNext {$CERTINEXT.ENV}: Pusher environment'
      type: TRAP
      key: certinext.env
      delay: '0'
      history: 90d
      value_type: CHAR
      trends: '0'
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        The CertiNext environment (prod / sandbox) the pusher connected to,
        sent on every run. Item keys carry no environment, so this is how a
        run sent to the wrong host (a wrong --zabbix-host or
        ZABBIX_HOSTNAME) is caught: see the misroute trigger.
      tags:
      - tag: env
        value: '{$CERTINEXT.ENV}'
      triggers:
      - uuid: eb5a495737444b88af0fb16614f727d1
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.env)<>"{$CERTINEXT.ENV}"'
        name: 'CertiNext {$CERTINEXT.ENV}: pusher data from the wrong environment'
        opdata: 'pusher environment: {ITEM.LASTVALUE1}'
        priority: HIGH
        description: |
          A pusher run that connected to a different CertiNext environment
          sent its metrics to this host, so this host's values are mixed
          with another environment's. Check --zabbix-host / ZABBIX_HOSTNAME
          on the pusher's units for this environment, or set
          {$CERTINEXT.ENV} on this host if it was never set (the template
          default is prod). Clears on the next correctly routed run.
        tags:
        - tag: env
          value: '{$CERTINEXT.ENV}'
    - uuid: 2439f008f9dd42e497dce35d465dd51f
      name: 'CertiNext {$CERTINEXT.ENV}: Domains total'
      type: TRAP
      key: certinext.domains.total
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Total domain records returned by the CertiNext domain list,
        after --validated-by (one CA, if set) and --domain-scope
        filtering (default: top-level only — see the pusher's --help).
        Guards against a silently empty list (vendor pagination/search
        bugs) — unverified=0 alone would look healthy in that failure
        mode. Upgrading to a --domain-scope other than "all", or setting
        or changing --validated-by, causes a one-time step in this
        graph — expected, not data loss.
      tags:
      - tag: env
        value: '{$CERTINEXT.ENV}'
      triggers:
      - uuid: efd506920f934729ba96fa73c3535202
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.domains.total)=0'
        name: 'CertiNext {$CERTINEXT.ENV}: domain list is empty'
        priority: WARNING
        description: |
          The pusher ran but the CertiNext API returned zero domains.
          Almost certainly an API-side regression (auth, pagination,
          search), not a real empty account — unless the pusher runs
          with --validated-by naming a CA the account holds no records
          for (check validated_by= in its log lines). Check the pusher
          logs on the sending host, then `certinext healthcheck`.
        tags:
        - tag: env
          value: '{$CERTINEXT.ENV}'
    - uuid: 8a6a729655c647c7832c0810f24f98de
      name: 'CertiNext {$CERTINEXT.ENV}: Unverified domains'
      type: TRAP
      key: certinext.domains.unverified
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Domain records that are ACTIVE but not DCV-VERIFIED (PENDING or
        REJECTED), after --validated-by (one CA, if set) and
        --domain-scope filtering (default: top-level only). Nonzero is
        normal briefly while a new domain's DCV challenge propagates
        through DNS; sustained nonzero means a domain is stuck.
      tags:
      - tag: env
        value: '{$CERTINEXT.ENV}'
      triggers:
      - uuid: 23f87eb23d5b449eb64c99dcc92d370c
        expression: 'min(/CertiNext DCV by Zabbix trapper/certinext.domains.unverified,{$CERTINEXT.UNVERIFIED.MAX_AGE})>0'
        name: 'CertiNext {$CERTINEXT.ENV}: domain(s) unverified too long'
        opdata: 'unverified: {ITEM.LASTVALUE1}'
        priority: AVERAGE
        description: |
          At least one domain has been unverified for the whole of
          {$CERTINEXT.UNVERIFIED.MAX_AGE}. DCV normally completes within
          an hour; a stuck domain means DNS propagation stalled or
          CertiNext rejected the DCV challenge. Check your DCV
          automation's logs and the domain's status in CertiNext to see
          which domain and step is stuck.
        tags:
        - tag: env
          value: '{$CERTINEXT.ENV}'
      - uuid: 77f29a654d6a4872b928bdd3c534c859
        expression: 'nodata(/CertiNext DCV by Zabbix trapper/certinext.domains.unverified,{$CERTINEXT.NODATA.FAST})=1'
        name: 'CertiNext {$CERTINEXT.ENV}: no data from pusher (frequent run)'
        priority: WARNING
        description: |
          No value received for {$CERTINEXT.NODATA.FAST} — the
          certinext-zabbix-push frequent timer is dead, erroring before
          the send, or the CertiNext API has been down across several
          runs. Check the timer and its journal on the sending host.
        tags:
        - tag: env
          value: '{$CERTINEXT.ENV}'
    - uuid: ef3133954ca04801b725fca8ef6259e3
      name: 'CertiNext {$CERTINEXT.ENV}: DCV expiring within lead time'
      type: TRAP
      key: certinext.dcv.expiring
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Verified token-method domains (DCV by a one-time token: DNS-TXT,
        HTTP, email...; after --domain-scope filtering, default: top-level
        only) whose DCV validTill falls within the renewal lead time (the
        pusher's --expiry-days, including already-lapsed). DNS-PERSIST
        domains are excluded: their validTill is only a reuse clock. Your
        DCV renewal automation should revalidate well before this window,
        so nonzero here means renewal has silently not been happening for
        that domain.
      tags:
      - tag: env
        value: '{$CERTINEXT.ENV}'
      triggers:
      - uuid: 40d21056f218406f862d49e65f897ecb
        expression: 'nodata(/CertiNext DCV by Zabbix trapper/certinext.dcv.expiring,{$CERTINEXT.NODATA.DAILY})=1'
        name: 'CertiNext {$CERTINEXT.ENV}: no data from pusher (daily expiry run)'
        priority: WARNING
        description: |
          No expiry metrics received for {$CERTINEXT.NODATA.DAILY} —
          the daily --expiry-days timer is dead, or a DCV-method read or a
          domain-detail refresh kept failing (the pusher deliberately skips
          the expiry push rather than undercount). Check the timer journal
          on the sending host.

          This also covers the dns-persist apex discovery, which is sent by
          the same run: the pusher never withholds discovery while sending
          expiry metrics, so stale discovery always shows up here first.
          (A trigger cannot reference a discovery rule's key directly.)
        tags:
        - tag: env
          value: '{$CERTINEXT.ENV}'
    - uuid: 24b6b7c41373401ea3aa30d25b6fea82
      name: 'CertiNext {$CERTINEXT.ENV}: DCV token-method domains'
      type: TRAP
      key: certinext.dcv.token_domains
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Verified token-method domains with a known DCV expiry — exactly the
        set "DCV minimum days left" is computed over. The days-left
        triggers only evaluate while this is above zero, so an account that
        has moved every domain to DNS-PERSIST stops alerting on the last
        (now stale) min_days_left value. Sent by the daily --expiry-days
        run.
      tags:
      - tag: env
        value: '{$CERTINEXT.ENV}'
    - uuid: ebb96d02f32641eb8b02482fb3e975a7
      name: 'CertiNext {$CERTINEXT.ENV}: DCV minimum days left'
      type: TRAP
      key: certinext.dcv.min_days_left
      delay: '0'
      value_type: FLOAT
      units: days
      history: 90d
      trends: 730d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Days until the soonest DCV expiry across verified token-method
        domains in scope (after --domain-scope filtering, default:
        top-level only; negative once lapsed). Carries the
        severity-gradient triggers (the thresholds are the
        {$CERTINEXT.DCV.*_DAYS} macros); the expiring-count item shows how
        many domains are in the window. Only updated by the daily
        --expiry-days run, so tier changes are detected at daily
        resolution. Absent when no token-method domain reports a
        validTill (see "DCV token-method domains").
      tags:
      - tag: env
        value: '{$CERTINEXT.ENV}'
    - uuid: 85c9fc2198c24a1886c47fc55a087464
      name: 'CertiNext {$CERTINEXT.ENV}: DCV persist minimum days left'
      type: TRAP
      key: certinext.dcv.persist_min_days_left
      delay: '0'
      value_type: FLOAT
      units: days
      history: 90d
      trends: 730d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Days until the soonest validTill across verified DNS-PERSIST
        domains in scope (negative once lapsed). For dns-persist the CA
        looks the _validation-persist TXT record up again at validation and
        issuance time, so validTill is a reuse period, not a deadline:
        lapsing is expected every cycle and only means the next issuance
        re-checks DNS. The real dependency is the TXT record itself,
        checked by the discovered "dns-persist" agent items. Absent when no
        DNS-PERSIST domain reports a validTill.
      tags:
      - tag: env
        value: '{$CERTINEXT.ENV}'
      triggers:
      - uuid: 5c218831fe614306b4894f9cf9f109b0
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.persist_min_days_left)<=0'
        name: 'CertiNext {$CERTINEXT.ENV}: dns-persist reuse period lapsed'
        opdata: 'min days left: {ITEM.LASTVALUE1}'
        priority: INFO
        description: |
          At least one DNS-PERSIST domain's validTill has passed. Nothing is
          broken: the next issuance for that domain re-checks the
          _validation-persist TXT record, and the "dns-persist record
          missing" triggers watch that record. Informational, to show
          whether and when CertiNext revalidates on its own.
        tags:
        - tag: env
          value: '{$CERTINEXT.ENV}'
    - uuid: e681c4ccc8394967a3b8f2c540d4f8e5
      name: 'CertiNext {$CERTINEXT.ENV}: dns-persist apexes discovered'
      type: TRAP
      key: certinext.dcv.persist_apexes
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Number of apexes in the dns-persist discovery list, sent with the
        list by the daily --expiry-days run (never without it). Carries the
        "apex count dropped" trigger: an apex missing from the list is a
        lost resource, and Zabbix deletes its TXT checks after the
        discovery rule's 3-day lifetime.
      tags:
      - tag: env
        value: '{$CERTINEXT.ENV}'
      triggers:
      - uuid: 9985a89f43e24072bad81568c8333453
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.persist_apexes)<max(/CertiNext DCV by Zabbix trapper/certinext.dcv.persist_apexes,4d)'
        name: 'CertiNext {$CERTINEXT.ENV}: dns-persist apex count dropped'
        opdata: 'now: {ITEM.LASTVALUE1}'
        priority: WARNING
        manual_close: 'YES'
        description: |
          Fewer apexes use dns-persist than at some point in the last 4
          days. Either a domain was removed or moved off dns-persist on
          purpose, or CertiNext returned a partial domain list. Find the
          missing apex under the discovery rule's items: they are marked
          as no longer discovered, and are deleted 3 days after they drop
          out. If the removal was deliberate, close this problem; it
          clears on its own once the 4-day window passes the old count.
          If it wasn't, check the pusher's log and the CertiNext domain
          list before the 3 days run out. The 4-day window is the rule's
          3-day lifetime plus one daily run, so a partial list that
          persists keeps this open until its checks are gone.
        tags:
        - tag: env
          value: '{$CERTINEXT.ENV}'
        - tag: scope
          value: availability
        # ------------------------------------------------ order health ---
        # Orders Report metrics (--order-health on its own hourly pusher run,
        # separate from --expiry-days — sysadmin/certinext-zabbix#8).
        # Deliberately does not use certificate_status (a vendor free-text
        # display string) for classification. The pusher fetches the report
        # unfiltered — the vendor's server-side status filter rejects 5 of
        # its 6 pending-* values with HTTP 422 (sysadmin/certinext-zabbix#3)
        # — and buckets client-side on order_status plus whether
        # certificate_expiry_date is populated, both typed fields confirmed
        # reliable against live data. See certinext_zabbix.zabbix_push's
        # module docstring and bucket_orders().
    - uuid: 36fcfa47611941048ec7e3604f1f9e93
      name: 'CertiNext {$CERTINEXT.ENV}: Orders awaiting issuance'
      type: TRAP
      key: certinext.orders.unissued
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Orders the CA has accepted but not yet generated a certificate for
        — still working through approval, DCV, CSR, documents, or the
        agreement. Deliberately NOT named "pending": the vendor's status
        enum uses pending-* for the whole pre-fulfillment space, which
        spans this item AND "Orders awaiting download".

        Nonzero is normal briefly while an order works through issuance;
        sustained nonzero means an order is stuck.
      tags:
      - tag: env
        value: '{$CERTINEXT.ENV}'
      triggers:
      - uuid: 3d57df86a88f4fc2acc0b29ad6698d26
        expression: 'min(/CertiNext DCV by Zabbix trapper/certinext.orders.unissued,{$CERTINEXT.ORDER.STUCK_AGE})>0'
        name: 'CertiNext {$CERTINEXT.ENV}: order(s) stuck awaiting issuance'
        opdata: 'awaiting issuance: {ITEM.LASTVALUE1}'
        priority: AVERAGE
        description: |
          At least one order has been awaiting issuance for the whole of
          {$CERTINEXT.ORDER.STUCK_AGE}. Check the account in CertiNext for
          which order and lifecycle step is stuck (CSR not submitted,
          agreement not accepted, approval pending, etc.).

          NOTE: this fires immediately against an account carrying a
          backlog of abandoned orders from earlier experimentation. Cancel
          those stale orders before enabling notifications, or the trigger
          will never clear. See docs/deployment.md.
        tags:
        - tag: env
          value: '{$CERTINEXT.ENV}'
      - uuid: 8d293822e167437e9d51288da3303c24
        expression: 'nodata(/CertiNext DCV by Zabbix trapper/certinext.orders.unissued,{$CERTINEXT.NODATA.ORDER_HEALTH})=1'
        name: 'CertiNext {$CERTINEXT.ENV}: no data from pusher (hourly order-health run)'
        priority: WARNING
        description: |
          No value received for {$CERTINEXT.NODATA.ORDER_HEALTH} — the
          --order-health hourly timer is dead, erroring before the send, or
          the CertiNext API has been down across several runs. Check the
          timer and its journal on the sending host.
        tags:
        - tag: env
          value: '{$CERTINEXT.ENV}'
    - uuid: a8ecce98b1714e058bf6cffefdf848c3
      name: 'CertiNext {$CERTINEXT.ENV}: Orders awaiting download'
      type: TRAP
      key: certinext.orders.undownloaded
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Orders whose certificate the CA has generated but nobody has
        downloaded. Distinct from "Orders awaiting issuance": the
        certificate exists and is already counting down its validity, it
        just was never collected — so this is a delivery/automation
        failure, not an issuance one. A cert billed for and never deployed
        also silently ages into the expiring-soon count.

        Typical causes: an ACME client that errored after the order was
        finalized, or a manual portal order nobody came back for.
      tags:
      - tag: env
        value: '{$CERTINEXT.ENV}'
      triggers:
      - uuid: c5dee50551ba458ba87ab845859494e7
        expression: 'min(/CertiNext DCV by Zabbix trapper/certinext.orders.undownloaded,{$CERTINEXT.ORDER.UNDOWNLOADED_AGE})>0'
        name: 'CertiNext {$CERTINEXT.ENV}: certificate(s) generated but never downloaded'
        opdata: 'awaiting download: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: |
          At least one generated certificate has gone uncollected for the
          whole of {$CERTINEXT.ORDER.UNDOWNLOADED_AGE}. Download it from
          the CertiNext portal and deploy it, or cancel the order if it is
          no longer wanted — an uncollected certificate keeps expiring on
          the CA's schedule regardless.

          NOTE: like the awaiting-issuance trigger, this fires immediately
          against an account carrying abandoned orders from earlier
          experimentation. Clear that backlog first. See docs/deployment.md.
        tags:
        - tag: env
          value: '{$CERTINEXT.ENV}'
    - uuid: 69c512fd0a1540bc947a2e62242709fe
      name: 'CertiNext {$CERTINEXT.ENV}: Orders failed recently'
      type: TRAP
      key: certinext.orders.failed_recent
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Orders in a terminal non-fulfilled state within the pusher's
        --order-failing-lookback-days window (default 30 days). Older
        failures are normal account history and are excluded — this is
        meant to flag a *recent* failure, not accumulate forever.

        CANCELLED ORDERS ARE DELIBERATELY EXCLUDED. Cancelling an order is
        routine administrative work; every order that has ever landed in
        this bucket in production was a cancellation, which would have held
        the trigger below in PROBLEM 83% of the measured period while
        signalling nothing. So in practice this counts terminal statuses
        the pusher does not recognize at all — see
        docs/adr/0010-cancelled-orders-are-not-failures.md.
      tags:
      - tag: env
        value: '{$CERTINEXT.ENV}'
      triggers:
      - uuid: 9102245241324df4b0904326a11308c9
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.orders.failed_recent)>0'
        name: 'CertiNext {$CERTINEXT.ENV}: recent order failure(s)'
        opdata: 'failed recently: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: |
          An order reached a terminal state the pusher does not recognize
          (not fulfilled, not in flight, not a cancellation) within the
          lookback window. Rejected/expired/revoked orders have never been
          observed in this account, so this firing means something genuinely
          new happened. Check the account in CertiNext for which order and
          why, and consider whether the new status needs classifying in
          bucket_orders().
        tags:
        - tag: env
          value: '{$CERTINEXT.ENV}'
    - uuid: aa38ebcda1ae44b68e40ba79a466f9a9
      name: 'CertiNext {$CERTINEXT.ENV}: Issued certificates expiring soon'
      type: TRAP
      key: certinext.orders.expiring
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Issued orders whose certificate_expiry_date falls within the
        pusher's --order-cert-expiry-days (including already-expired).
        A distinct signal from certinext.dcv.expiring: this tracks the
        issued certificate's own expiry per the CA's order record,
        independent of DCV verification state — a cert can be expiring
        here while DCV is still fine, e.g. if renewal broke somewhere
        downstream of DCV.

        DELIBERATELY HAS NO TRIGGER — do not add one. This is a
        graph/capacity signal only. Production certificate lifetimes are
        bimodal (~30-day, overwhelmingly ACME, and ~199-day) with nothing
        expiring between 30 and 90 days out, so the count reads the same
        at any threshold in that range and a freshly-renewed 30-day cert
        is inside a 30-day window from the moment it is issued. No
        threshold can separate healthy mid-life certs from genuinely
        lapsed ones. See docs/adr/0008-orders-expiring-ships-data-only.md;
        a trigger becomes possible once the metric is segmented by
        originator (docs/wishlist/IDEA-005).
      tags:
      - tag: env
        value: '{$CERTINEXT.ENV}'
    - uuid: 025434e05c904e598dae9654d37c3675
      name: 'CertiNext {$CERTINEXT.ENV}: Days since last certificate issued'
      type: TRAP
      key: certinext.orders.days_since_issued
      delay: '0'
      value_type: FLOAT
      units: d
      history: 90d
      trends: 730d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Days since the most recent order with an "issued" certificate
        status, by order_date. Absent when no order in the "issued" status
        filter carries a parseable order_date.

        Baseline for the trigger (UMS prod, 2026-08-19 to 2026-11-18,
        2,142 hourly trend rows): median 0.19 d, p95 0.93 d, p99 1.72 d,
        worst gap 2.09 d after the pusher's first day. The default
        threshold of 4 days leaves roughly twice that headroom. An account
        that issues less often, such as a sandbox, needs a host-level
        override.
      tags:
      - tag: env
        value: '{$CERTINEXT.ENV}'
      triggers:
      - uuid: 2f54a8369cdf45edb03f4cbed2a9c3ff
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.orders.days_since_issued)>{$CERTINEXT.ORDER.DAYS_SINCE_ISSUED_MAX}'
        name: 'CertiNext {$CERTINEXT.ENV}: no certificate issued for over {$CERTINEXT.ORDER.DAYS_SINCE_ISSUED_MAX} days'
        opdata: 'days since last issued: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: |
          No order in this account has reached an issued certificate for
          longer than {$CERTINEXT.ORDER.DAYS_SINCE_ISSUED_MAX} days, well
          beyond the measured normal gap. Issuance has probably stalled
          across the board: ACME clients failing, an expired account key,
          a DCV or product-code problem at the CA, or a vendor outage. Check
          recent orders in CertiNext and the ACME clients' logs. See
          docs/wishlist/IDEA-003-days-since-issued-alert-threshold.md.
        tags:
        - tag: env
          value: '{$CERTINEXT.ENV}'
    discovery_rules:
    - uuid: 1c8e6d45cc2341b1b7a0afb318f3baaf
      name: 'CertiNext {$CERTINEXT.ENV}: dns-persist apex discovery'
      type: TRAP
      key: certinext.dcv.persist.discovery
      delay: '0'
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      lifetime: 3d
      enabled_lifetime_type: DISABLE_NEVER
      description: |
        Apexes whose DCV method is DNS-PERSIST, sent by the daily
        --expiry-days pusher run as [{"{#APEX}": "example.edu"}, ...]. For
        each apex the agent looks up _validation-persist.{#APEX} TXT on the
        local resolver and on two public resolvers, and checks that the
        expected value ({$CERTINEXT.PERSIST.EXPECTED}) is published.

        The pusher only sends a complete list: if any domain's DCV method
        could not be read it withholds the list for that run, because an
        apex missing from the list is a lost resource. Lost resources are
        deleted after 3 days and never disabled, so one bad run cannot
        silently remove an apex's checks.
      item_prototypes:
      - uuid: 27cb27c47f3f41629fd677b384c7e6d6
        name: 'CertiNext {$CERTINEXT.ENV}: dns-persist [{#APEX}]: TXT record, local resolver'
        key: 'net.dns.record[,_validation-persist.{#APEX},TXT]'
        delay: '{$CERTINEXT.DNS.INTERVAL.LOCAL}'
        history: 7d
        value_type: TEXT
        trends: '0'
        description: |
          The _validation-persist TXT record for {#APEX} as the pusher
          machine's own resolver sees it: one line per value, each
          <name> TXT "<value>". A name with no record yields an empty value
          (preprocessing maps "Cannot perform DNS query" to ""), so the
          "record missing" trigger evaluates. Any other failure, such as a
          resolver timeout, leaves the item unsupported and is caught by
          "TXT lookup failing" instead.
        preprocessing:
        - type: CHECK_NOT_SUPPORTED
          parameters:
          - '0'
          - '^Cannot perform DNS query'
          error_handler: CUSTOM_VALUE
          error_handler_params: ''
        tags:
        - tag: apex
          value: '{#APEX}'
        - tag: env
          value: '{$CERTINEXT.ENV}'
        trigger_prototypes:
        - uuid: 60c21b5d5d2f4d6d82a5a70b587e7255
          expression: 'find(/CertiNext DCV by Zabbix trapper/net.dns.record[,_validation-persist.{#APEX},TXT],#3,"like","\"{$CERTINEXT.PERSIST.EXPECTED:{#APEX}}\"")=0'
          name: 'CertiNext {$CERTINEXT.ENV}: dns-persist record missing for {#APEX}'
          opdata: 'TXT: {ITEM.LASTVALUE1}'
          priority: HIGH
          description: |
            None of the last 3 lookups (about 15 minutes) of
            _validation-persist.{#APEX} TXT on the local resolver contained
            the expected value {$CERTINEXT.PERSIST.EXPECTED:{#APEX}}. The CA
            checks this record at every validation and issuance, so
            certificate orders for {#APEX} and its subdomains will fail DCV
            until it is restored. Republish the record with your DCV
            automation, then check it with dig.
          tags:
          - tag: env
            value: '{$CERTINEXT.ENV}'
          - tag: scope
            value: availability
      - uuid: c8d648f7d5d54ce0bc394fb7f553782b
        name: 'CertiNext {$CERTINEXT.ENV}: dns-persist [{#APEX}]: TXT record, resolver {$CERTINEXT.DNS.RESOLVER.1}'
        key: 'net.dns.record[{$CERTINEXT.DNS.RESOLVER.1},_validation-persist.{#APEX},TXT]'
        delay: '{$CERTINEXT.DNS.INTERVAL.EXTERNAL}'
        history: 7d
        value_type: TEXT
        trends: '0'
        description: |
          The _validation-persist TXT record for {#APEX} as public resolver
          {$CERTINEXT.DNS.RESOLVER.1} sees it, to catch a record that is
          visible internally but not on the public internet (split-horizon
          DNS, an unpublished zone). Needs outbound DNS from the pusher
          machine to this resolver.
        preprocessing:
        - type: CHECK_NOT_SUPPORTED
          parameters:
          - '0'
          - '^Cannot perform DNS query'
          error_handler: CUSTOM_VALUE
          error_handler_params: ''
        tags:
        - tag: apex
          value: '{#APEX}'
        - tag: env
          value: '{$CERTINEXT.ENV}'
      - uuid: 058842ce6e7d4dd59bb8c299a46b4dcb
        name: 'CertiNext {$CERTINEXT.ENV}: dns-persist [{#APEX}]: TXT record, resolver {$CERTINEXT.DNS.RESOLVER.2}'
        key: 'net.dns.record[{$CERTINEXT.DNS.RESOLVER.2},_validation-persist.{#APEX},TXT]'
        delay: '{$CERTINEXT.DNS.INTERVAL.EXTERNAL}'
        history: 7d
        value_type: TEXT
        trends: '0'
        description: |
          The _validation-persist TXT record for {#APEX} as public resolver
          {$CERTINEXT.DNS.RESOLVER.2} sees it. See the resolver 1 item.
        preprocessing:
        - type: CHECK_NOT_SUPPORTED
          parameters:
          - '0'
          - '^Cannot perform DNS query'
          error_handler: CUSTOM_VALUE
          error_handler_params: ''
        tags:
        - tag: apex
          value: '{#APEX}'
        - tag: env
          value: '{$CERTINEXT.ENV}'
      trigger_prototypes:
      - uuid: da77e35dc0344aa489cb0c6d346afd54
        expression: 'find(/CertiNext DCV by Zabbix trapper/net.dns.record[{$CERTINEXT.DNS.RESOLVER.1},_validation-persist.{#APEX},TXT],#2,"like","\"{$CERTINEXT.PERSIST.EXPECTED:{#APEX}}\"")=0 or find(/CertiNext DCV by Zabbix trapper/net.dns.record[{$CERTINEXT.DNS.RESOLVER.2},_validation-persist.{#APEX},TXT],#2,"like","\"{$CERTINEXT.PERSIST.EXPECTED:{#APEX}}\"")=0'
        name: 'CertiNext {$CERTINEXT.ENV}: dns-persist record for {#APEX} not visible publicly'
        opdata: '{$CERTINEXT.DNS.RESOLVER.1}: {ITEM.LASTVALUE1}; {$CERTINEXT.DNS.RESOLVER.2}: {ITEM.LASTVALUE2}'
        priority: AVERAGE
        description: |
          The local resolver sees the expected _validation-persist record
          for {#APEX}, but the last 2 lookups on at least one public
          resolver did not. The CA resolves from the public internet, so
          this is the record it would miss: check that the zone is
          published externally (split-horizon views) and that the public
          resolvers aren't serving a stale negative answer.
        dependencies:
        - name: 'CertiNext {$CERTINEXT.ENV}: dns-persist record missing for {#APEX}'
          expression: 'find(/CertiNext DCV by Zabbix trapper/net.dns.record[,_validation-persist.{#APEX},TXT],#3,"like","\"{$CERTINEXT.PERSIST.EXPECTED:{#APEX}}\"")=0'
        tags:
        - tag: env
          value: '{$CERTINEXT.ENV}'
        - tag: scope
          value: availability
      - uuid: 3fc567122788481f9d63695e365c8dbc
        expression: 'nodata(/CertiNext DCV by Zabbix trapper/net.dns.record[,_validation-persist.{#APEX},TXT],{$CERTINEXT.DNS.NODATA})=1 or nodata(/CertiNext DCV by Zabbix trapper/net.dns.record[{$CERTINEXT.DNS.RESOLVER.1},_validation-persist.{#APEX},TXT],{$CERTINEXT.DNS.NODATA})=1 or nodata(/CertiNext DCV by Zabbix trapper/net.dns.record[{$CERTINEXT.DNS.RESOLVER.2},_validation-persist.{#APEX},TXT],{$CERTINEXT.DNS.NODATA})=1'
        name: 'CertiNext {$CERTINEXT.ENV}: dns-persist TXT lookup failing for {#APEX}'
        priority: AVERAGE
        description: |
          At least one of the three _validation-persist lookups for {#APEX}
          has returned no value for {$CERTINEXT.DNS.NODATA}: the resolver
          timed out or is unreachable, or the agent on the pusher machine is
          down. This is a monitoring failure, not a missing record — a
          missing record still returns a value (empty) and raises "record
          missing" instead. Check the item's error in Latest data, outbound
          DNS from the pusher machine, and the agent.
        tags:
        - tag: env
          value: '{$CERTINEXT.ENV}'
        - tag: scope
          value: availability
    macros:
    - macro: '{$CERTINEXT.DCV.AVG_DAYS}'
      value: '2'
      description: 'AVERAGE severity when the soonest token-method DCV expiry is within this many days'
    - macro: '{$CERTINEXT.DCV.DISASTER_DAYS}'
      value: '0'
      description: 'DISASTER severity when the soonest token-method DCV expiry is at/below this many days (lapsed)'
    - macro: '{$CERTINEXT.DCV.HIGH_DAYS}'
      value: '1'
      description: 'HIGH severity when the soonest token-method DCV expiry is within this many days'
    - macro: '{$CERTINEXT.DCV.WARN_DAYS}'
      value: '3'
      description: 'WARNING severity when the soonest token-method DCV expiry is within this many days. DNS-PERSIST domains never reach these triggers (their validTill is a reuse clock, see the persist items). Raise it for a CA with long DCV windows (e.g. emSign, ~1 year)'
    - macro: '{$CERTINEXT.DNS.INTERVAL.EXTERNAL}'
      value: 1h
      description: 'How often each dns-persist TXT record is looked up on the two public resolvers'
    - macro: '{$CERTINEXT.DNS.INTERVAL.LOCAL}'
      value: 5m
      description: 'How often each dns-persist TXT record is looked up on the pusher machine''s own resolver. "Record missing" needs 3 consecutive misses, so this sets its debounce (3 × 5m ≈ 15 minutes)'
    - macro: '{$CERTINEXT.DNS.NODATA}'
      value: 3h
      description: 'nodata() window for the dns-persist lookups. Must exceed DNS.INTERVAL.EXTERNAL: at the 1h default, one missed public lookup is tolerated and the third consecutive one alerts'
    - macro: '{$CERTINEXT.DNS.RESOLVER.1}'
      value: 1.1.1.1
      description: 'First public resolver for the dns-persist "visible publicly" check'
    - macro: '{$CERTINEXT.DNS.RESOLVER.2}'
      value: 8.8.8.8
      description: 'Second public resolver for the dns-persist "visible publicly" check'
    - macro: '{$CERTINEXT.ENV}'
      value: prod
      description: 'SET ON EACH HOST: the CertiNext environment (prod / sandbox) whose pusher runs target this host. Used in names and the env tag, and compared against the certinext.env value each run sends (misroute trigger). A sandbox host left at this default raises the misroute trigger on its first run'
    - macro: '{$CERTINEXT.NODATA.DAILY}'
      value: 26h
      description: 'nodata() window for the daily expiry items — one missed daily run alerts'
    - macro: '{$CERTINEXT.NODATA.FAST}'
      value: 13h
      description: 'nodata() window for the frequent items — one missed 6-hour run tolerated, two alert'
    - macro: '{$CERTINEXT.NODATA.ORDER_HEALTH}'
      value: 3h
      description: 'nodata() window for the hourly order-health items — one missed hourly run tolerated, two alert'
    - macro: '{$CERTINEXT.ORDER.DAYS_SINCE_ISSUED_MAX}'
      value: '4'
      description: 'WARNING when no certificate has been issued for more than this many days (a plain number of days, not a time suffix: the item is in days). Default from 3 months of UMS prod data, where the worst normal gap was 2.09 days; raise it on a low-volume account such as a sandbox'
    - macro: '{$CERTINEXT.ORDER.STUCK_AGE}'
      value: 24h
      description: 'How long an order may sit awaiting issuance (accepted, no certificate generated) before the "stuck" trigger fires. The min() trigger requires every sample in this window to be nonzero, so it assumes --order-health pushes at least hourly (see NODATA.ORDER_HEALTH) — at the old daily cadence the window held only one sample and the guard silently degraded to last()>0 (sysadmin/certinext-zabbix#8)'
    - macro: '{$CERTINEXT.ORDER.UNDOWNLOADED_AGE}'
      value: 7d
      description: 'How long a generated certificate may sit undownloaded before its trigger fires. Longer than STUCK_AGE: a manual portal order can legitimately wait for someone to collect it, whereas an ACME order should download within seconds'
    - macro: '{$CERTINEXT.PERSIST.EXPECTED}'
      value: CONFIGURE-ME
      description: 'SET ON EACH HOST: the exact value of your _validation-persist TXT record, without the surrounding quotes (e.g. ssl.com; accounturi=https://...). The default matches nothing, so every discovered apex alerts until it is set — fail closed. Override one apex with context: {$CERTINEXT.PERSIST.EXPECTED:example.edu}'
    - macro: '{$CERTINEXT.SENDER.ALLOWED}'
      value: 127.0.0.1
      description: 'REQUIRED PER-DEPLOYMENT EDIT: source IP(s) of the host running certinext-zabbix-push; the committed placeholder rejects all senders until you set it.'
    - macro: '{$CERTINEXT.UNVERIFIED.MAX_AGE}'
      value: 7h
      description: 'How long unverified domains must persist before alerting (just over one 6-hour run cycle)'
  triggers:
  - uuid: 4dbfc3e2b4a04f5aad75fe0141ccbb55
    expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left)<={$CERTINEXT.DCV.DISASTER_DAYS} and last(/CertiNext DCV by Zabbix trapper/certinext.dcv.token_domains)>0'
    name: 'CertiNext {$CERTINEXT.ENV}: DCV lapsed'
    opdata: 'min days left: {ITEM.LASTVALUE1}'
    priority: DISASTER
    description: |
      A token-method domain's DCV validity has run out — certificate
      issuance/renewal for that domain (and its subdomains) is failing
      NOW. Identify the domain with `certinext-zabbix-push --dry-run
      --expiry-days 14 -v`, then revalidate/renew its DCV via CertiNext.
    tags:
    - tag: env
      value: '{$CERTINEXT.ENV}'
  - uuid: 0d327d76b2c54e4fa8f07f867b15249a
    expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left)<={$CERTINEXT.DCV.AVG_DAYS} and last(/CertiNext DCV by Zabbix trapper/certinext.dcv.token_domains)>0'
    name: 'CertiNext {$CERTINEXT.ENV}: DCV expires within {$CERTINEXT.DCV.AVG_DAYS} days'
    opdata: 'min days left: {ITEM.LASTVALUE1}'
    priority: AVERAGE
    description: |
      A token-method domain's DCV expires within {$CERTINEXT.DCV.AVG_DAYS}
      days and renewal has not happened. Your renewal automation should
      have caught this at 30 days out — find out why it has not.
    dependencies:
    - name: 'CertiNext {$CERTINEXT.ENV}: DCV expires within {$CERTINEXT.DCV.HIGH_DAYS} day(s)'
      expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left)<={$CERTINEXT.DCV.HIGH_DAYS} and last(/CertiNext DCV by Zabbix trapper/certinext.dcv.token_domains)>0'
    tags:
    - tag: env
      value: '{$CERTINEXT.ENV}'
  - uuid: 3f5143b645b7453b87ff62effa038e0e
    expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left)<={$CERTINEXT.DCV.HIGH_DAYS} and last(/CertiNext DCV by Zabbix trapper/certinext.dcv.token_domains)>0'
    name: 'CertiNext {$CERTINEXT.ENV}: DCV expires within {$CERTINEXT.DCV.HIGH_DAYS} day(s)'
    opdata: 'min days left: {ITEM.LASTVALUE1}'
    priority: HIGH
    description: |
      A token-method domain's DCV expires within {$CERTINEXT.DCV.HIGH_DAYS}
      day(s) and renewal has not happened. Last chance before issuance
      for that domain starts failing — renew today.
    dependencies:
    - name: 'CertiNext {$CERTINEXT.ENV}: DCV lapsed'
      expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left)<={$CERTINEXT.DCV.DISASTER_DAYS} and last(/CertiNext DCV by Zabbix trapper/certinext.dcv.token_domains)>0'
    tags:
    - tag: env
      value: '{$CERTINEXT.ENV}'
  - uuid: 812c4ee6e33543caa746d4da5cb1e75f
    expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left)<={$CERTINEXT.DCV.WARN_DAYS} and last(/CertiNext DCV by Zabbix trapper/certinext.dcv.token_domains)>0'
    name: 'CertiNext {$CERTINEXT.ENV}: DCV expires within {$CERTINEXT.DCV.WARN_DAYS} days'
    opdata: 'min days left: {ITEM.LASTVALUE1}'
    priority: WARNING
    description: |
      A token-method domain's DCV expires within {$CERTINEXT.DCV.WARN_DAYS}
      days without renewal — renewal is roughly two weeks overdue (your
      renewal automation should typically catch this at 30 days out).
      Investigate before it escalates.
    dependencies:
    - name: 'CertiNext {$CERTINEXT.ENV}: DCV expires within {$CERTINEXT.DCV.AVG_DAYS} days'
      expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left)<={$CERTINEXT.DCV.AVG_DAYS} and last(/CertiNext DCV by Zabbix trapper/certinext.dcv.token_domains)>0'
    tags:
    - tag: env
      value: '{$CERTINEXT.ENV}'
