# CertiNext DCV by Zabbix trapper — Zabbix 7.0 import file.
#
# Source of truth for the trapper items that `certinext-zabbix-push`
# (this repo) sends: the item keys here and the KEY_* constants in
# certinext_zabbix/zabbix_push.py must stay in sync. Every item
# exists twice, key-parameterized by environment ([prod] / [sandbox]);
# the pusher derives the parameter from its resolved connection.
#
# Everything carries an `env` tag. To mute sandbox notifications, add a
# condition to the relevant trigger action (Alerts → Actions):
#   Tag value | env | does not equal | sandbox
# Sandbox problems still show in the UI — they just never page anyone.
#
# Import via Data collection → Templates → Import. See this template's
# README.md for the manual steps around it (linking the host, scheduling
# the pusher).
zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: c97e1e605e9e4e1fa4050b09b1345599
    name: Templates/Custom
  templates:
  - uuid: af6fbfd6e8bf4e50a3ff7156f32b589b
    template: 'CertiNext DCV by Zabbix trapper'
    name: 'CertiNext DCV by Zabbix trapper'
    description: |
      CertiNext DCV health, pushed by the certinext-zabbix-push CLI from
      certinext-zabbix (https://github.com/tod-uma/certinext-zabbix).

      All items are trappers — nothing is polled. Items are duplicated
      per environment via key parameters ([prod] / [sandbox]); the pusher
      picks the parameter from its CertiNext connection. Two schedules
      feed each environment: a frequent run (domain totals) and a daily
      run with --expiry-days and/or --order-health (DCV expiry and order
      health). nodata() triggers catch a dead pusher. DCV expiry alerts
      escalate through a severity gradient on min_days_left (WARNING 14d
      → AVERAGE 7d → HIGH 1d → DISASTER lapsed, thresholds in the
      {$CERTINEXT.DCV.*_DAYS} macros), dependency-chained so only the
      most severe tier fires. Order-health alerts on orders stuck awaiting
      issuance past {$CERTINEXT.ORDER.STUCK_AGE}, certificates generated
      but left undownloaded past {$CERTINEXT.ORDER.UNDOWNLOADED_AGE}, and
      orders that recently failed; days-since-last-issued is pushed with
      no trigger yet, pending a baseline of normal cadence.

      Both order-stuck triggers fire immediately against an account
      carrying abandoned orders from earlier experimentation — clear that
      backlog before enabling notifications. See docs/deployment.md.

      Every item and trigger is tagged env:prod or env:sandbox — filter
      notification actions on that tag to keep sandbox problems silent.
    groups:
    - name: Templates/Custom
    items:
        # ------------------------------------------------------- prod ---
    - uuid: 2439f008f9dd42e497dce35d465dd51f
      name: 'CertiNext prod: Domains total'
      type: TRAP
      key: 'certinext.domains.total[prod]'
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Total domains returned by the CertiNext domain list, after
        --domain-scope filtering (default: top-level only — see
        --domain-scope in the pusher's --help). Guards against a
        silently empty list (vendor pagination/search bugs) —
        unverified=0 alone would look healthy in that failure mode.
        Upgrading to a --domain-scope other than "all" causes a
        one-time drop in this graph — expected, not data loss.
      tags:
      - tag: env
        value: prod
      triggers:
      - uuid: efd506920f934729ba96fa73c3535202
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.domains.total[prod])=0'
        name: 'CertiNext prod: domain list is empty'
        priority: WARNING
        description: |
          The pusher ran but the CertiNext API returned zero domains.
          Almost certainly an API-side regression (auth, pagination,
          search), not a real empty account. Check the pusher logs on
          the sending host, then `certinext healthcheck`.
        tags:
        - tag: env
          value: prod
    - uuid: 8a6a729655c647c7832c0810f24f98de
      name: 'CertiNext prod: Unverified domains'
      type: TRAP
      key: 'certinext.domains.unverified[prod]'
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Domains that are ACTIVE but not DCV-VERIFIED (PENDING or
        REJECTED), after --domain-scope filtering (default: top-level
        only). Nonzero is normal briefly while a new domain's DCV
        challenge propagates through DNS; sustained nonzero means a
        domain is stuck.
      tags:
      - tag: env
        value: prod
      triggers:
      - uuid: 23f87eb23d5b449eb64c99dcc92d370c
        expression: 'min(/CertiNext DCV by Zabbix trapper/certinext.domains.unverified[prod],{$CERTINEXT.UNVERIFIED.MAX_AGE})>0'
        name: 'CertiNext prod: domain(s) unverified too long'
        opdata: 'unverified: {ITEM.LASTVALUE1}'
        priority: AVERAGE
        description: |
          At least one domain has been unverified for the whole of
          {$CERTINEXT.UNVERIFIED.MAX_AGE}. DCV normally completes within
          an hour; a stuck domain means DNS propagation stalled or
          CertiNext rejected the DCV challenge. Check your DCV
          automation's logs and the domain's status in CertiNext to see
          which domain and step is stuck.
        tags:
        - tag: env
          value: prod
      - uuid: 77f29a654d6a4872b928bdd3c534c859
        expression: 'nodata(/CertiNext DCV by Zabbix trapper/certinext.domains.unverified[prod],{$CERTINEXT.NODATA.FAST})=1'
        name: 'CertiNext prod: no data from pusher (frequent run)'
        priority: WARNING
        description: |
          No value received for {$CERTINEXT.NODATA.FAST} — the
          certinext-zabbix-push frequent timer is dead, erroring before
          the send, or the CertiNext API has been down across several
          runs. Check the timer and its journal on the sending host.
        tags:
        - tag: env
          value: prod
    - uuid: ef3133954ca04801b725fca8ef6259e3
      name: 'CertiNext prod: DCV expiring within lead time'
      type: TRAP
      key: 'certinext.dcv.expiring[prod]'
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Verified domains (after --domain-scope filtering, default:
        top-level only) whose DCV validTill falls within the renewal
        lead time (the pusher's --expiry-days, including already-lapsed).
        Your DCV renewal automation should revalidate well before this
        window, so nonzero here means renewal has silently not been
        happening for that domain.
      tags:
      - tag: env
        value: prod
      triggers:
      - uuid: 40d21056f218406f862d49e65f897ecb
        expression: 'nodata(/CertiNext DCV by Zabbix trapper/certinext.dcv.expiring[prod],{$CERTINEXT.NODATA.DAILY})=1'
        name: 'CertiNext prod: no data from pusher (daily expiry run)'
        priority: WARNING
        description: |
          No expiry metrics received for {$CERTINEXT.NODATA.DAILY} —
          the daily --expiry-days timer is dead or a domain-detail
          refresh kept failing (the pusher deliberately skips the
          expiry push rather than undercount). Check the timer journal
          on the sending host.
        tags:
        - tag: env
          value: prod
    - uuid: ebb96d02f32641eb8b02482fb3e975a7
      name: 'CertiNext prod: DCV minimum days left'
      type: TRAP
      key: 'certinext.dcv.min_days_left[prod]'
      delay: '0'
      value_type: FLOAT
      units: days
      history: 90d
      trends: 730d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Days until the soonest DCV expiry across all verified domains
        in scope (after --domain-scope filtering, default: top-level
        only; negative once lapsed). Carries the severity-gradient
        triggers (the thresholds are the {$CERTINEXT.DCV.*_DAYS}
        macros); the expiring-count item shows how many domains are in
        the window. Only updated by the daily --expiry-days run, so
        tier changes are detected at daily resolution. Absent when no
        verified domain reports a validTill.
      tags:
      - tag: env
        value: prod
      triggers:
      - uuid: 4dbfc3e2b4a04f5aad75fe0141ccbb55
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left[prod])<={$CERTINEXT.DCV.DISASTER_DAYS}'
        name: 'CertiNext prod: DCV lapsed'
        opdata: 'min days left: {ITEM.LASTVALUE1}'
        priority: DISASTER
        description: |
          A domain's DCV validity has run out — certificate
          issuance/renewal for that domain (and its subdomains) is
          failing NOW. Identify the domain with `certinext-zabbix-push
          --dry-run --expiry-days 14 -v`, then revalidate/renew its DCV
          via CertiNext.
        tags:
        - tag: env
          value: prod
      - uuid: 3f5143b645b7453b87ff62effa038e0e
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left[prod])<={$CERTINEXT.DCV.HIGH_DAYS}'
        name: 'CertiNext prod: DCV expires within {$CERTINEXT.DCV.HIGH_DAYS} day(s)'
        opdata: 'min days left: {ITEM.LASTVALUE1}'
        priority: HIGH
        description: |
          A domain's DCV expires within {$CERTINEXT.DCV.HIGH_DAYS}
          day(s) and renewal has not happened. Last chance before
          issuance for that domain starts failing — renew today.
        dependencies:
        - name: 'CertiNext prod: DCV lapsed'
          expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left[prod])<={$CERTINEXT.DCV.DISASTER_DAYS}'
        tags:
        - tag: env
          value: prod
      - uuid: 0d327d76b2c54e4fa8f07f867b15249a
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left[prod])<={$CERTINEXT.DCV.AVG_DAYS}'
        name: 'CertiNext prod: DCV expires within {$CERTINEXT.DCV.AVG_DAYS} days'
        opdata: 'min days left: {ITEM.LASTVALUE1}'
        priority: AVERAGE
        description: |
          A domain's DCV expires within {$CERTINEXT.DCV.AVG_DAYS} days
          and renewal has not happened. Your renewal automation should
          have caught this at 30 days out — find out why it has not.
        dependencies:
        - name: 'CertiNext prod: DCV expires within {$CERTINEXT.DCV.HIGH_DAYS} day(s)'
          expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left[prod])<={$CERTINEXT.DCV.HIGH_DAYS}'
        tags:
        - tag: env
          value: prod
      - uuid: 812c4ee6e33543caa746d4da5cb1e75f
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left[prod])<={$CERTINEXT.DCV.WARN_DAYS}'
        name: 'CertiNext prod: DCV expires within {$CERTINEXT.DCV.WARN_DAYS} days'
        opdata: 'min days left: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: |
          A domain's DCV expires within {$CERTINEXT.DCV.WARN_DAYS} days
          without renewal — renewal is roughly two weeks overdue (your
          renewal automation should typically catch this at 30 days
          out). Investigate before it escalates.
        dependencies:
        - name: 'CertiNext prod: DCV expires within {$CERTINEXT.DCV.AVG_DAYS} days'
          expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left[prod])<={$CERTINEXT.DCV.AVG_DAYS}'
        tags:
        - tag: env
          value: prod
        # ------------------------------------------------ order health ---
        # Orders Report metrics (--order-health on the daily pusher run).
        # Deliberately does not use certificate_status (a vendor free-text
        # display string) for classification. The pusher fetches the report
        # unfiltered — the vendor's server-side status filter rejects 5 of
        # its 6 pending-* values with HTTP 422 (sysadmin/certinext-zabbix#3)
        # — and buckets client-side on order_status plus whether
        # certificate_expiry_date is populated, both typed fields confirmed
        # reliable against live data. See certinext_zabbix.zabbix_push's
        # module docstring and bucket_orders().
    - uuid: 36fcfa47611941048ec7e3604f1f9e93
      name: 'CertiNext prod: Orders awaiting issuance'
      type: TRAP
      key: 'certinext.orders.unissued[prod]'
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Orders the CA has accepted but not yet generated a certificate for
        — still working through approval, DCV, CSR, documents, or the
        agreement. Deliberately NOT named "pending": the vendor's status
        enum uses pending-* for the whole pre-fulfillment space, which
        spans this item AND "Orders awaiting download".

        Nonzero is normal briefly while an order works through issuance;
        sustained nonzero means an order is stuck.
      tags:
      - tag: env
        value: prod
      triggers:
      - uuid: 3d57df86a88f4fc2acc0b29ad6698d26
        expression: 'min(/CertiNext DCV by Zabbix trapper/certinext.orders.unissued[prod],{$CERTINEXT.ORDER.STUCK_AGE})>0'
        name: 'CertiNext prod: order(s) stuck awaiting issuance'
        opdata: 'awaiting issuance: {ITEM.LASTVALUE1}'
        priority: AVERAGE
        description: |
          At least one order has been awaiting issuance for the whole of
          {$CERTINEXT.ORDER.STUCK_AGE}. Check the account in CertiNext for
          which order and lifecycle step is stuck (CSR not submitted,
          agreement not accepted, approval pending, etc.).

          NOTE: this fires immediately against an account carrying a
          backlog of abandoned orders from earlier experimentation. Cancel
          those stale orders before enabling notifications, or the trigger
          will never clear. See docs/deployment.md.
        tags:
        - tag: env
          value: prod
      - uuid: 8d293822e167437e9d51288da3303c24
        expression: 'nodata(/CertiNext DCV by Zabbix trapper/certinext.orders.unissued[prod],{$CERTINEXT.NODATA.DAILY})=1'
        name: 'CertiNext prod: no data from pusher (daily order-health run)'
        priority: WARNING
        description: |
          No value received for {$CERTINEXT.NODATA.DAILY} — the
          --order-health daily timer is dead, erroring before the send, or
          the CertiNext API has been down across several runs. Check the
          timer and its journal on the sending host.
        tags:
        - tag: env
          value: prod
    - uuid: a8ecce98b1714e058bf6cffefdf848c3
      name: 'CertiNext prod: Orders awaiting download'
      type: TRAP
      key: 'certinext.orders.undownloaded[prod]'
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Orders whose certificate the CA has generated but nobody has
        downloaded. Distinct from "Orders awaiting issuance": the
        certificate exists and is already counting down its validity, it
        just was never collected — so this is a delivery/automation
        failure, not an issuance one. A cert billed for and never deployed
        also silently ages into the expiring-soon count.

        Typical causes: an ACME client that errored after the order was
        finalized, or a manual portal order nobody came back for.
      tags:
      - tag: env
        value: prod
      triggers:
      - uuid: c5dee50551ba458ba87ab845859494e7
        expression: 'min(/CertiNext DCV by Zabbix trapper/certinext.orders.undownloaded[prod],{$CERTINEXT.ORDER.UNDOWNLOADED_AGE})>0'
        name: 'CertiNext prod: certificate(s) generated but never downloaded'
        opdata: 'awaiting download: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: |
          At least one generated certificate has gone uncollected for the
          whole of {$CERTINEXT.ORDER.UNDOWNLOADED_AGE}. Download it from
          the CertiNext portal and deploy it, or cancel the order if it is
          no longer wanted — an uncollected certificate keeps expiring on
          the CA's schedule regardless.

          NOTE: like the awaiting-issuance trigger, this fires immediately
          against an account carrying abandoned orders from earlier
          experimentation. Clear that backlog first. See docs/deployment.md.
        tags:
        - tag: env
          value: prod
    - uuid: 69c512fd0a1540bc947a2e62242709fe
      name: 'CertiNext prod: Orders failed recently'
      type: TRAP
      key: 'certinext.orders.failed_recent[prod]'
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Orders rejected, cancelled, expired, or revoked within the
        pusher's --order-failing-lookback-days window (default 30 days).
        Older failures are normal account history and are excluded —
        this is meant to flag a *recent* failure, not accumulate forever.
      tags:
      - tag: env
        value: prod
      triggers:
      - uuid: 9102245241324df4b0904326a11308c9
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.orders.failed_recent[prod])>0'
        name: 'CertiNext prod: recent order failure(s)'
        opdata: 'failed recently: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: |
          At least one order was rejected, cancelled, expired, or revoked
          within the lookback window. Check the account in CertiNext for
          which order and why.
        tags:
        - tag: env
          value: prod
    - uuid: aa38ebcda1ae44b68e40ba79a466f9a9
      name: 'CertiNext prod: Issued certificates expiring soon'
      type: TRAP
      key: 'certinext.orders.expiring[prod]'
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Issued orders whose certificate_expiry_date falls within the
        pusher's --order-cert-expiry-days (including already-expired).
        A distinct signal from certinext.dcv.expiring: this tracks the
        issued certificate's own expiry per the CA's order record,
        independent of DCV verification state — a cert can be expiring
        here while DCV is still fine, e.g. if renewal broke somewhere
        downstream of DCV.

        DELIBERATELY HAS NO TRIGGER — do not add one. This is a
        graph/capacity signal only. Production certificate lifetimes are
        bimodal (~30-day, overwhelmingly ACME, and ~199-day) with nothing
        expiring between 30 and 90 days out, so the count reads the same
        at any threshold in that range and a freshly-renewed 30-day cert
        is inside a 30-day window from the moment it is issued. No
        threshold can separate healthy mid-life certs from genuinely
        lapsed ones. See docs/adr/0008-orders-expiring-ships-data-only.md;
        a trigger becomes possible once the metric is segmented by
        originator (docs/wishlist/IDEA-005).
      tags:
      - tag: env
        value: prod
    - uuid: 025434e05c904e598dae9654d37c3675
      name: 'CertiNext prod: Days since last certificate issued'
      type: TRAP
      key: 'certinext.orders.days_since_issued[prod]'
      delay: '0'
      value_type: FLOAT
      units: d
      history: 90d
      trends: 730d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Days since the most recent order with an "issued" certificate
        status, by order_date. No severity trigger yet — this item is
        intentionally trigger-less until there's enough history to know
        what a normal issuance cadence looks like for this account; see
        docs/wishlist/IDEA-003-days-since-issued-alert-threshold.md.
        Absent when no order in the "issued" status filter carries a
        parseable order_date.
      tags:
      - tag: env
        value: prod
        # ---------------------------------------------------- sandbox ---
        # Mirror of the prod items/triggers with the [sandbox] key
        # parameter and env:sandbox tags. Same severities — mute the
        # notifications via the action tag condition, not by weakening the
        # triggers (the UI signal stays honest during sandbox testing).
    - uuid: f9d18dfe1d95464aad6dca5f23661fe9
      name: 'CertiNext sandbox: Domains total'
      type: TRAP
      key: 'certinext.domains.total[sandbox]'
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Total domains returned by the CertiNext sandbox domain list,
        after --domain-scope filtering (default: top-level only).
        Upgrading to a --domain-scope other than "all" causes a
        one-time drop in this graph — expected, not data loss.
      tags:
      - tag: env
        value: sandbox
      triggers:
      - uuid: 73b5238f46fc4c4da0498a1d0409efb9
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.domains.total[sandbox])=0'
        name: 'CertiNext sandbox: domain list is empty'
        priority: WARNING
        description: |
          The sandbox pusher ran but the CertiNext sandbox API
          returned zero domains — likely an API-side regression (auth,
          pagination, search), not a real empty account.
        tags:
        - tag: env
          value: sandbox
    - uuid: c9594c8f52074f718ac2a320ed0587fe
      name: 'CertiNext sandbox: Unverified domains'
      type: TRAP
      key: 'certinext.domains.unverified[sandbox]'
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Sandbox domains that are ACTIVE but not DCV-VERIFIED, after
        --domain-scope filtering (default: top-level only). Expect
        this to be nonzero during deliberate sandbox testing.
      tags:
      - tag: env
        value: sandbox
      triggers:
      - uuid: 2c99e1b418974d05a563d008e9b1c3aa
        expression: 'min(/CertiNext DCV by Zabbix trapper/certinext.domains.unverified[sandbox],{$CERTINEXT.UNVERIFIED.MAX_AGE})>0'
        name: 'CertiNext sandbox: domain(s) unverified too long'
        opdata: 'unverified: {ITEM.LASTVALUE1}'
        priority: AVERAGE
        description: |
          Sandbox domain(s) unverified for the whole of
          {$CERTINEXT.UNVERIFIED.MAX_AGE}. Often a deliberate test
          state — notifications for env:sandbox should be muted at
          the action level.
        tags:
        - tag: env
          value: sandbox
      - uuid: 534d879f40994e84a4399d0c513e8671
        expression: 'nodata(/CertiNext DCV by Zabbix trapper/certinext.domains.unverified[sandbox],{$CERTINEXT.NODATA.FAST})=1'
        name: 'CertiNext sandbox: no data from pusher (frequent run)'
        status: DISABLED
        priority: WARNING
        description: |
          No sandbox value received for {$CERTINEXT.NODATA.FAST}.
          Ships DISABLED because nodata() fires even for items that
          have never received data — enable this trigger once a
          sandbox frequent run is actually scheduled.
        tags:
        - tag: env
          value: sandbox
    - uuid: b94825912b63445fbd622c60c447fa64
      name: 'CertiNext sandbox: DCV expiring within lead time'
      type: TRAP
      key: 'certinext.dcv.expiring[sandbox]'
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Sandbox verified domains (after --domain-scope filtering,
        default: top-level only) whose DCV validTill falls within the
        renewal lead time (the pusher's --expiry-days).
      tags:
      - tag: env
        value: sandbox
      triggers:
      - uuid: 703cd52541164a50aaee49c472070d75
        expression: 'nodata(/CertiNext DCV by Zabbix trapper/certinext.dcv.expiring[sandbox],{$CERTINEXT.NODATA.DAILY})=1'
        name: 'CertiNext sandbox: no data from pusher (daily expiry run)'
        status: DISABLED
        priority: WARNING
        description: |
          No sandbox expiry metrics received for
          {$CERTINEXT.NODATA.DAILY}. Ships DISABLED because nodata()
          fires even for items that have never received data — enable
          this trigger once a sandbox daily run is actually scheduled.
        tags:
        - tag: env
          value: sandbox
    - uuid: 360cb663103b4fb8853fcfad644e31ad
      name: 'CertiNext sandbox: DCV minimum days left'
      type: TRAP
      key: 'certinext.dcv.min_days_left[sandbox]'
      delay: '0'
      value_type: FLOAT
      units: days
      history: 90d
      trends: 730d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Days until the soonest sandbox DCV expiry in scope (after
        --domain-scope filtering, default: top-level only; negative
        once lapsed). Same gradient triggers as prod, tagged
        env:sandbox.
      tags:
      - tag: env
        value: sandbox
      triggers:
      - uuid: 6b439982791748c0a7bb6b03177fd502
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left[sandbox])<={$CERTINEXT.DCV.DISASTER_DAYS}'
        name: 'CertiNext sandbox: DCV lapsed'
        opdata: 'min days left: {ITEM.LASTVALUE1}'
        priority: DISASTER
        description: |
          A sandbox domain's DCV validity has run out. Frequently a
          deliberate test state (e.g. reinitiate/expiry experiments) —
          notifications for env:sandbox should be muted at the action
          level.
        tags:
        - tag: env
          value: sandbox
      - uuid: 6452a2d8521347b98627b5ea40f79143
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left[sandbox])<={$CERTINEXT.DCV.HIGH_DAYS}'
        name: 'CertiNext sandbox: DCV expires within {$CERTINEXT.DCV.HIGH_DAYS} day(s)'
        opdata: 'min days left: {ITEM.LASTVALUE1}'
        priority: HIGH
        description: |
          A sandbox domain's DCV expires within
          {$CERTINEXT.DCV.HIGH_DAYS} day(s) without renewal.
        dependencies:
        - name: 'CertiNext sandbox: DCV lapsed'
          expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left[sandbox])<={$CERTINEXT.DCV.DISASTER_DAYS}'
        tags:
        - tag: env
          value: sandbox
      - uuid: 0bad34b933a545f5a98f96d3a05edeb8
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left[sandbox])<={$CERTINEXT.DCV.AVG_DAYS}'
        name: 'CertiNext sandbox: DCV expires within {$CERTINEXT.DCV.AVG_DAYS} days'
        opdata: 'min days left: {ITEM.LASTVALUE1}'
        priority: AVERAGE
        description: |
          A sandbox domain's DCV expires within
          {$CERTINEXT.DCV.AVG_DAYS} days without renewal.
        dependencies:
        - name: 'CertiNext sandbox: DCV expires within {$CERTINEXT.DCV.HIGH_DAYS} day(s)'
          expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left[sandbox])<={$CERTINEXT.DCV.HIGH_DAYS}'
        tags:
        - tag: env
          value: sandbox
      - uuid: a6c9d283dfa64ac7963e598b7dbd4b32
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left[sandbox])<={$CERTINEXT.DCV.WARN_DAYS}'
        name: 'CertiNext sandbox: DCV expires within {$CERTINEXT.DCV.WARN_DAYS} days'
        opdata: 'min days left: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: |
          A sandbox domain's DCV expires within
          {$CERTINEXT.DCV.WARN_DAYS} days without renewal.
        dependencies:
        - name: 'CertiNext sandbox: DCV expires within {$CERTINEXT.DCV.AVG_DAYS} days'
          expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.dcv.min_days_left[sandbox])<={$CERTINEXT.DCV.AVG_DAYS}'
        tags:
        - tag: env
          value: sandbox
        # ------------------------------------------------ order health ---
    - uuid: 1a7c3c5a63bc487b971b783d87a804c1
      name: 'CertiNext sandbox: Orders awaiting issuance'
      type: TRAP
      key: 'certinext.orders.unissued[sandbox]'
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Sandbox orders accepted but with no certificate generated yet.
        Often a deliberate test state.
      tags:
      - tag: env
        value: sandbox
      triggers:
      - uuid: d223f5b2d3764be7a29f4d64fc0ed04e
        expression: 'min(/CertiNext DCV by Zabbix trapper/certinext.orders.unissued[sandbox],{$CERTINEXT.ORDER.STUCK_AGE})>0'
        name: 'CertiNext sandbox: order(s) stuck awaiting issuance'
        opdata: 'awaiting issuance: {ITEM.LASTVALUE1}'
        priority: AVERAGE
        description: |
          Sandbox order(s) awaiting issuance for the whole of
          {$CERTINEXT.ORDER.STUCK_AGE}. Often a deliberate test state —
          notifications for env:sandbox should be muted at the action
          level.
        tags:
        - tag: env
          value: sandbox
      - uuid: a6e206d90e194da09133c5dde105b233
        expression: 'nodata(/CertiNext DCV by Zabbix trapper/certinext.orders.unissued[sandbox],{$CERTINEXT.NODATA.DAILY})=1'
        name: 'CertiNext sandbox: no data from pusher (daily order-health run)'
        status: DISABLED
        priority: WARNING
        description: |
          No sandbox value received for {$CERTINEXT.NODATA.DAILY}. Ships
          DISABLED because nodata() fires even for items that have never
          received data — enable this trigger once a sandbox
          --order-health daily run is actually scheduled.
        tags:
        - tag: env
          value: sandbox
    - uuid: 625f082da9d140de9bc2643a59c3c6c8
      name: 'CertiNext sandbox: Orders awaiting download'
      type: TRAP
      key: 'certinext.orders.undownloaded[sandbox]'
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Sandbox orders whose certificate was generated but never
        downloaded. Often a deliberate test state.
      tags:
      - tag: env
        value: sandbox
      triggers:
      - uuid: 8336c4084d974f0baa19afdbedbcc183
        expression: 'min(/CertiNext DCV by Zabbix trapper/certinext.orders.undownloaded[sandbox],{$CERTINEXT.ORDER.UNDOWNLOADED_AGE})>0'
        name: 'CertiNext sandbox: certificate(s) generated but never downloaded'
        opdata: 'awaiting download: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: |
          Sandbox certificate(s) uncollected for the whole of
          {$CERTINEXT.ORDER.UNDOWNLOADED_AGE}. Often a deliberate test
          state — notifications for env:sandbox should be muted at the
          action level.
        tags:
        - tag: env
          value: sandbox
    - uuid: e7281e82ec8444ee9fdc8ba6f0f689d6
      name: 'CertiNext sandbox: Orders failed recently'
      type: TRAP
      key: 'certinext.orders.failed_recent[sandbox]'
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Sandbox orders rejected, cancelled, expired, or revoked within
        the pusher's --order-failing-lookback-days window.
      tags:
      - tag: env
        value: sandbox
      triggers:
      - uuid: 45a5488b5ce14153be4c4afd78b266d2
        expression: 'last(/CertiNext DCV by Zabbix trapper/certinext.orders.failed_recent[sandbox])>0'
        name: 'CertiNext sandbox: recent order failure(s)'
        opdata: 'failed recently: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: |
          Sandbox order(s) rejected, cancelled, expired, or revoked within
          the lookback window. Often a deliberate test state.
        tags:
        - tag: env
          value: sandbox
    - uuid: 7a20c6f0658b44258cec319b3f1212a1
      name: 'CertiNext sandbox: Issued certificates expiring soon'
      type: TRAP
      key: 'certinext.orders.expiring[sandbox]'
      delay: '0'
      history: 90d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Sandbox issued orders whose certificate_expiry_date falls within
        the pusher's --order-cert-expiry-days (including already-expired).

        DELIBERATELY HAS NO TRIGGER — do not add one. Matches the prod
        item: a graph/capacity signal only, because no threshold can
        separate healthy short-lived certs from genuinely lapsed ones.
        See docs/adr/0008-orders-expiring-ships-data-only.md.
      tags:
      - tag: env
        value: sandbox
    - uuid: 765bf06a961d4be8ae7982e3525be5b3
      name: 'CertiNext sandbox: Days since last certificate issued'
      type: TRAP
      key: 'certinext.orders.days_since_issued[sandbox]'
      delay: '0'
      value_type: FLOAT
      units: d
      history: 90d
      trends: 730d
      allowed_hosts: '{$CERTINEXT.SENDER.ALLOWED}'
      description: |
        Days since the most recent sandbox order with an "issued"
        certificate status. No severity trigger yet — same deferral as
        the prod item.
      tags:
      - tag: env
        value: sandbox
    macros:
    - macro: '{$CERTINEXT.DCV.AVG_DAYS}'
      value: '7'
      description: 'AVERAGE severity when the soonest DCV expiry is within this many days'
    - macro: '{$CERTINEXT.DCV.DISASTER_DAYS}'
      value: '0'
      description: 'DISASTER severity when the soonest DCV expiry is at/below this many days (lapsed)'
    - macro: '{$CERTINEXT.DCV.HIGH_DAYS}'
      value: '1'
      description: 'HIGH severity when the soonest DCV expiry is within this many days'
    - macro: '{$CERTINEXT.DCV.WARN_DAYS}'
      value: '14'
      description: 'WARNING severity when the soonest DCV expiry is within this many days'
    - macro: '{$CERTINEXT.NODATA.DAILY}'
      value: 26h
      description: 'nodata() window for the daily expiry items — one missed daily run alerts'
    - macro: '{$CERTINEXT.NODATA.FAST}'
      value: 13h
      description: 'nodata() window for the frequent items — one missed 6-hour run tolerated, two alert'
    - macro: '{$CERTINEXT.ORDER.STUCK_AGE}'
      value: 24h
      description: 'How long an order may sit awaiting issuance (accepted, no certificate generated) before the "stuck" trigger fires'
    - macro: '{$CERTINEXT.ORDER.UNDOWNLOADED_AGE}'
      value: 7d
      description: 'How long a generated certificate may sit undownloaded before its trigger fires. Longer than STUCK_AGE: a manual portal order can legitimately wait for someone to collect it, whereas an ACME order should download within seconds'
    - macro: '{$CERTINEXT.SENDER.ALLOWED}'
      value: 127.0.0.1
      description: 'REQUIRED PER-DEPLOYMENT EDIT: source IP(s) of the host running certinext-zabbix-push; the committed placeholder rejects all senders until you set it.'
    - macro: '{$CERTINEXT.UNVERIFIED.MAX_AGE}'
      value: 7h
      description: 'How long unverified domains must persist before alerting (just over one 6-hour run cycle)'
